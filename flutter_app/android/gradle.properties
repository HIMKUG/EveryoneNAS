# LanVault Android 8C16T 极限性能构建与 R8 Full Mode 配置
# 针对 8 核 16 线程主机调优并发度、JVM 堆内存与全模式代码/资源裁剪

# Gradle 并行构建与缓存（8C16T 满载）
org.gradle.parallel=true
org.gradle.workers.max=16
org.gradle.caching=true
# Flutter 的 ReleaseMinSdkCheck 任务不可被配置缓存序列化，故关闭配置缓存
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx6144m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin 增量编译与守护进程堆配置
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx4096m

# AndroidX 与 R8 Full Mode 极限优化
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
