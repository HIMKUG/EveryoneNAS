[workspace]
resolver = "2"
members = [
    "crates/lanvault-core",
    "crates/lanvault-server",
    "crates/lanvault-client",
    "crates/lanvault-ffi",
    "crates/lanvault-win-svc",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize", "pkcs8"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
blake3 = "1.8"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
fastcdc = "3.2"
zstd = "0.13"
brotli-decompressor = "6.3"
mdns-sd = "0.18"
axum = { version = "0.8", features = ["ws"] }
tower-cookies = "0.11"
dashmap = "6"
notify = "7"
windows-service = "0.8"
flutter_rust_bridge = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
overflow-checks = false

[profile.release.package."*"]
opt-level = 3
